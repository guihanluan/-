# YOLO11n CBAM@Neck：Backbone不动，只在 Neck 三个输出后各加 1 个 CBAM
# 动机：之前 P3/P4 后加 CBAM 会过早压掉浅层小目标特征，移到 Neck 融合后加权
nc: 3
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15
  - [-1, 2, C3k2, [256, False]] # 16 P3/8-small（n尺度64通道）
  - [-1, 1, CBAM, [64]] # 17 新增：P3 输出后注意力
  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19
  - [-1, 2, C3k2, [512, False]] # 20 P4/16-medium（n尺度128通道）
  - [-1, 1, CBAM, [128]] # 21 新增：P4 输出后注意力
  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 10], 1, Concat, [1]] # 23
  - [-1, 2, C3k2, [1024, True]] # 24 P5/32-large（n尺度256通道）
  - [-1, 1, CBAM, [256]] # 25 新增：P5 输出后注意力
  - [[17, 21, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5)
